name: APK und AAB bauen
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Debug-APK bauen
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: AquariumPflege-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Signiertes AAB für Google Play bauen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" gradle bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with: { name: AquariumPflege-aab, path: app/build/outputs/bundle/release/app-release.aab }
